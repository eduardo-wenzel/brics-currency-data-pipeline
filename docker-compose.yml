services:
  postgres:
    image: postgres:16-alpine
    container_name: brics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-brics_pipeline}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-brics_pipeline}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brics-pipeline-app
    restart: on-failure
    env_file:
      - .env
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,socket; s=socket.create_connection((os.getenv('PG_HOST','postgres'), int(os.getenv('PG_PORT','5432'))), 2); s.close()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    command: ["python", "-m", "pipeline.run"]

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    profiles: ["airflow"]
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER:-postgres}:${PG_PASSWORD:-postgres}@postgres:5432/${PG_DATABASE:-brics_pipeline}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-brics-airflow-secret}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      PG_HOST: postgres
      PG_PORT: 5432
      PYTHONPATH: /opt/airflow
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -c
      - >
        airflow db migrate &&
        airflow users create
        --username ${AIRFLOW_ADMIN_USERNAME:-airflow}
        --firstname Airflow
        --lastname Admin
        --role Admin
        --email ${AIRFLOW_ADMIN_EMAIL:-airflow@example.com}
        --password ${AIRFLOW_ADMIN_PASSWORD:-airflow}

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    profiles: ["airflow"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER:-postgres}:${PG_PASSWORD:-postgres}@postgres:5432/${PG_DATABASE:-brics_pipeline}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-brics-airflow-secret}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      PG_HOST: postgres
      PG_PORT: 5432
      PYTHONPATH: /opt/airflow
    volumes:
      - ./logs/airflow:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: ["airflow", "webserver"]

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    profiles: ["airflow"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER:-postgres}:${PG_PASSWORD:-postgres}@postgres:5432/${PG_DATABASE:-brics_pipeline}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-brics-airflow-secret}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      PG_HOST: postgres
      PG_PORT: 5432
      PYTHONPATH: /opt/airflow
    volumes:
      - ./logs/airflow:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: ["airflow", "scheduler"]

  app-s3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brics-pipeline-app-s3
    restart: on-failure
    profiles: ["s3"]
    env_file:
      - .env
    environment:
      SKIP_DB_LOAD: "true"
    command: ["python", "-m", "pipeline.run"]

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: brics-pgadmin
    restart: unless-stopped
    profiles: ["admin"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@bricspipeline.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
