[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brics-currency-pipeline"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["pipeline"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(\.conda|\.pytest_cache|\.pytest_tmp|data/pytest_tmp|\.ruff_cache)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".conda",
    ".pytest_cache",
    ".pytest_tmp",
    ".ruff_cache",
    "data/pytest_tmp",
    "notebooks/*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider --basetemp=data/pytest_tmp"
